<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Confronto Fornitori</title>
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f8f9fa;
      margin: 0;
      padding: 2rem;
    }
    h1 {
      text-align: center;
      color: #333;
    }
    .filters {
      display: flex;
      gap: 1rem;
      justify-content: center;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }
    select {
      padding: 0.5rem;
      font-size: 1rem;
      border-radius: 0.5rem;
      border: 1px solid #ccc;
      min-width: 200px;
    }
    #grafico {
      width: 100%;
      max-width: 1200px;
      margin: auto;
    }
    #riepilogo {
      max-width: 1200px;
      margin: 2rem auto;
      text-align: center;
      font-size: 1.2rem;
      background: #fff;
      border-radius: 10px;
      padding: 1rem;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
  <h1>📊 Dashboard Confronto Prezzi Fornitori</h1>
  <div class="filters">
    <select id="stagioneFilter" multiple></select>
    <select id="marcaFilter" multiple></select>
    <select id="calettamentoFilter" multiple></select>
  </div>
  <div id="riepilogo"></div>
  <div id="grafico"></div>

  <script>
    let rawData = [];

    fetch("data.json")
      .then(res => res.json())
      .then(data => {
        rawData = data;
        popolaFiltri();
        aggiornaGrafico();
      });

    function popolaFiltri() {
      const stagioni = [...new Set(rawData.map(r => r.Stagione))];
      const marche = [...new Set(rawData.map(r => r.Marca))];
      const calettamenti = [...new Set(rawData.map(r => r.Calettamento))];

      stagioni.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s;
        opt.textContent = s;
        document.getElementById('stagioneFilter').appendChild(opt);
      });

      marche.forEach(m => {
        const opt = document.createElement('option');
        opt.value = m;
        opt.textContent = m;
        document.getElementById('marcaFilter').appendChild(opt);
      });

      calettamenti.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c;
        opt.textContent = c;
        document.getElementById('calettamentoFilter').appendChild(opt);
      });

      document.getElementById('stagioneFilter').addEventListener('change', aggiornaGrafico);
      document.getElementById('marcaFilter').addEventListener('change', aggiornaGrafico);
      document.getElementById('calettamentoFilter').addEventListener('change', aggiornaGrafico);
    }

    function getSelectedValues(select) {
      return Array.from(select.selectedOptions).map(opt => opt.value);
    }

    function aggiornaGrafico() {
      const stagioni = getSelectedValues(document.getElementById('stagioneFilter'));
      const marcheSel = getSelectedValues(document.getElementById('marcaFilter'));
      const calettamenti = getSelectedValues(document.getElementById('calettamentoFilter'));

      const filtrati = rawData.filter(r =>
        (stagioni.length === 0 || stagioni.includes(r.Stagione)) &&
        (marcheSel.length === 0 || marcheSel.includes(r.Marca)) &&
        (calettamenti.length === 0 || calettamenti.includes(r.Calettamento))
      );

      const migliori = filtrati.filter(r => r.Stato === "Migliore");
      const nonMigliori = filtrati.filter(r => r.Stato === "Non Migliore");

      const marche = [...new Set(filtrati.map(r => r.Marca))];
      const x = marche;
      const y1 = marche.map(m => migliori.filter(r => r.Marca === m).length);
      const y2 = marche.map(m => nonMigliori.filter(r => r.Marca === m).length);

      const trace1 = {
        x: y1,
        y: x,
        name: 'Migliore',
        type: 'bar',
        orientation: 'h',
        marker: {color: '#2ECC71'},
        text: y1,
        textposition: 'auto',
        textfont: {color: '#000', size: 12},
        insidetextanchor: 'start'
      };

      const trace2 = {
        x: y2,
        y: x,
        name: 'Non Migliore',
        type: 'bar',
        orientation: 'h',
        marker: {color: '#E74C3C'},
        text: y2,
        textposition: 'auto',
        textfont: {color: '#000', size: 12},
        insidetextanchor: 'start'
      };

      const layout = {
        barmode: 'stack',
        title: 'Articoli per Marca (Filtrati)',
        margin: {l: 300},
        height: 600,
        yaxis: {automargin: true}
      };

      Plotly.newPlot('grafico', [trace1, trace2], layout);

      document.getElementById('riepilogo').innerHTML = `
        <strong>Totale articoli filtrati:</strong> ${filtrati.length} | 
        <strong>Migliori:</strong> ${migliori.length} | 
        <strong>Non Migliori:</strong> ${nonMigliori.length}
      `;
    }
  </script>
</body>
</html>
